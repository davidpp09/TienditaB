spring.application.name=Tiendita Api

# 8090 y no 8080: durante el desarrollo esta máquina también corre el backend de
# RestFood en el 8080. En la Raspberry el 8080 estará libre, pero se conserva el
# 8090 para que la configuración sea la misma en los dos lados.
server.port=${SERVER_PORT:8090}
# El backend escucha SOLO en loopback: la única puerta desde la red es Caddy.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Caddy termina el TLS y habla por http en loopback; sin esto Spring cree que la
# petición del mostrador es cruzada. (Misma lección que RestFood.)
server.forward-headers-strategy=${FORWARD_HEADERS:FRAMEWORK}

# Las variables llevan prefijo TIENDITA_ a propósito. Los nombres genéricos
# (DB_USER, DB_PASSWORD) ya están tomados: el .bashrc de esta máquina exporta
# DB_PASSWORD para RestFood, y se coló a los tests de este proyecto el primer
# día. Un nombre propio por proyecto elimina esa clase de error entera.
spring.datasource.url=${TIENDITA_DB_URL:jdbc:mariadb://localhost:3307/tiendita}
# Sin valores por omisión A PROPÓSITO: si faltan estas variables la app no
# arranca, en vez de conectarse en silencio con un usuario privilegiado.
# En producción viven en /etc/tiendita/backend.env.
spring.datasource.username=${TIENDITA_DB_USER}
spring.datasource.password=${TIENDITA_DB_PASSWORD}

# Con Flyway activo, Hibernate NO toca el esquema. `validate` compara las
# entidades contra las tablas: si alguien agrega un campo y olvida la migración,
# la app no arranca y el CI lo detecta en el PR.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# `flyway clean` borra todas las tablas. No hay ningún motivo para ejecutarlo
# contra la tienda.
spring.flyway.clean-disabled=true

# Monitoreo: solo health, sin detalles. Incluye la base de datos, así que si
# MariaDB no responde devuelve DOWN con 503 y salta la alerta.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${HEALTH_DETALLES:never}

# Orígenes del frontend. 5180 en desarrollo (5173 es de RestFood).
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5180,http://127.0.0.1:5180}

# Lo que sale impreso en el ticket.
# El "¡" va escapado como \u00A1 a propósito: Spring lee los .properties en
# ISO-8859-1, no en UTF-8, y escrito tal cual salía "Â¡Gracias" en el papel.
# Lo fija TicketFueraDeTransaccionTest.
tienda.nombre=${TIENDA_NOMBRE:LA TIENDITA}
tienda.pie-ticket=${TIENDA_PIE:\u00A1Gracias por su compra!}
