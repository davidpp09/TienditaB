# Los tests corren contra una base MariaDB REAL, no contra H2: es la única forma
# de que las migraciones de Flyway se prueben de verdad. En local es el contenedor
# de ~/tiendita/entorno; en el CI, el servicio de GitHub Actions, que gana porque
# las variables de entorno tienen precedencia sobre este archivo.
#
# El prefijo TIENDITA_ no es adorno: el .bashrc de la máquina de desarrollo
# exporta DB_PASSWORD para RestFood, y con el nombre genérico los tests de este
# proyecto intentaban entrar con la contraseña del otro.
#
# `tiendita_test`, NO `tiendita`. La mayoría de los tests corren en transacción y
# hacen rollback, pero no todos: TicketFueraDeTransaccionTest renuncia al
# rollback a propósito, y todo lo que escribe se queda. Apuntando a la base de
# desarrollo, ese test le metía una venta de $36 a la caja de verdad y después
# cerraba el corte que encontrara abierto —el de la tienda, con su fondo y su
# diferencia—. Pasó el 2026-08-13. Dos bases distintas es lo que lo hace
# imposible, no la buena voluntad de quien escriba el siguiente test.
spring.datasource.url=${TIENDITA_DB_URL:jdbc:mariadb://localhost:3307/tiendita_test}
spring.datasource.username=${TIENDITA_DB_USER:tiendita_app}
spring.datasource.password=${TIENDITA_DB_PASSWORD:tiendita_dev}
server.address=127.0.0.1
